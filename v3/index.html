<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hesap — rassrochka shartnomasi 2 daqiqada (v3)</title>
<meta name="description" content="Hesap ilovasida rassrochka shartnomasini MyID bilan rasmiy imzolang.">
<link rel="icon" href="/logo.jpg">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/v3/v3.css">
</head>
<body class="v3">
<header class="nav"><div class="wrap nav-in"><a class="brand" href="/v3/"><img class="logo" src="/logo.jpg" width="30" height="30" alt="">Hesap</a><a class="nav-cta" href="/v2/">v2</a></div></header>
<main>
  <section class="top wrap">
    <div>
      <p class="eyebrow">Elektron shartnoma</p>
      <h1>Rassrochkaga mahsulot berasizmi?</h1>
      <p class="lead">Shartnomani 2 daqiqada rasmiy imzolang. Pastda yordamchimizga bir necha savolga javob bering.</p>
    </div>
    <img src="/phone.svg" alt="Hesap ilovasi" width="360" height="520" class="art">
  </section>
  <section class="wrap chatwrap" id="chat-sec">
    <div class="chat">
      <div class="chat-head"><img src="/logo.jpg" alt="" width="36" height="36"><div><b>Hesap yordamchisi</b><small>onlayn</small></div></div>
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <div class="quick" id="quick"></div>
      <form class="bar" id="bar" novalidate><input id="inp" class="field" autocomplete="off" maxlength="120" placeholder="Javobingizni yozing..."><button class="send" type="submit" aria-label="Yuborish">➤</button></form>
    </div>
  </section>
</main>
<script src="/lead.js"></script>
<script src="/v3/app.js"></script>
